services:
  devmate-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devmate-api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DEVMATE_DB_PATH: "/data/devmate.db"
    volumes:
      - devmate-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  devmate-data:
